services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noclash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noclash}
      POSTGRES_DB: ${POSTGRES_DB:-noclash}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noclash} -d ${POSTGRES_DB:-noclash}"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
